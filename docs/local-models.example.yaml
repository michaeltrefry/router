# Self-hosted OpenAI-compatible models. Point ROUTER_LOCAL_MODELS_FILE at a copy
# of this file; each entry registers its own provider (local_<id>) and catalog
# row, and becomes forceable with `x-weave-force-model: <id>`.
models:
  - id: qwen3.8-flash-next
    # OpenAI-compatible base; /chat/completions is appended.
    base_url: http://localhost:8081/v1
    # Name of the env var holding the server's bearer key (not the key itself).
    api_key_env: LOCAL_QWEN_API_KEY
    # Model name the server expects in the request body.
    upstream_model: qwen3.8-flash-next-unsloth-ud-q4_k_xl
    context_window: 262144
    # low | mid | high
    tier: mid
    # default | low — low keeps the model off tool-bearing / agentic turns.
    tool_use: default
    agentic: default
    image_input: false
    # reasoning_content (OpenAI-compatible field) | think_tags (inline <think>)
    reasoning_format: reasoning_content
    # How long to wait for response headers before treating the server as
    # down and serving the turn on its normal route. Default 30s.
    response_header_timeout: 30s

# Optional: serve these turn types on one of the models above. Omit the block to
# keep every turn on normal routing. A turn falls back to normal routing when the
# installation excluded the model, it cannot carry the request (context window,
# images, tool_use/agentic: low on a tool-bearing turn), or a user forced a model.
turn_routing:
  model: qwen3.8-flash-next
  # Default when omitted: sub_agent_dispatch, title_gen, probe, recap.
  # Only these four are accepted; main-loop, tool-result, classifier and
  # compaction turns are never served by this route.
  turn_types: [sub_agent_dispatch, title_gen, probe, recap]

# Optional: when the router's own selection for a turn is a mid-tier model
# (e.g. claude-sonnet-5), serve it on this local model instead. The model must
# be tier: mid. Omit the block, or set enabled: false, to turn it off. A forced
# model is never substituted, and a turn the local model cannot carry keeps the
# router's selection.
mid_tier_substitute:
  model: qwen3.8-flash-next
  enabled: true

# Optional: when the caller's Claude or Codex subscription refuses a turn for
# its rate limit or plan exhaustion (a 429, a Codex usage_limit_reached /
# insufficient_quota rejection, an exhausted subscription pool, or a plan the
# router already read spent) before any output reached the client, serve that
# turn on this local model instead of returning the error. Any tier is
# accepted. A paid API key for the same provider, when one is configured, still
# retries the turn first. Omit the block, or set enabled: false, to turn it off.
subscription_fallback:
  model: qwen3.8-flash-next
  enabled: true

# Optional: serve the router's automatic selection of one catalog model on
# another catalog model, e.g. a trained scorer's roster model on the current
# release of the same family. Both sides must be catalog models, a target must
# not itself be mapped, and each source must be a candidate of the active
# cluster scorer (a retired source such as claude-fable-5 or gpt-5.5 takes its
# target's tier so the scorer can select it again). A forced model, a hard-pinned utility turn
# (compaction, title generation, probe, sub-agent override), a classifier turn
# and a usage-bypassed turn are dispatched unmapped. Session pins, HMM history
# and policy outcomes keep the original selection; the outcome is withheld from
# training. Mapping runs before mid_tier_substitute, which still judges the
# tier of the original selection, so a claude-sonnet-5 pick is mapped to
# claude-sonnet-5-5 and then served on the mid-tier substitute when it is on.
model_mapping:
  claude-opus-5: claude-opus-5-5
  claude-fable-5: claude-fable-5-1
  claude-sonnet-5: claude-sonnet-5-5
  gpt-5.5: gpt-6.1-sol
  gpt-5.4-mini: gpt-6-luna

# Optional: serve the router's automatic selection on a local model when the
# model it lands on matches a pattern. `match` is a catalog model ID or a glob
# (`*` matches any run of characters, `?` one, `[...]` a class) and must name at
# least one catalog model; `model` must be one of the models above, of any tier.
# Rules match the final model, after model_mapping, so with the mapping above a
# gpt-5.4-mini pick becomes gpt-6-luna and is served here. Rules are tried in
# order and the first match wins; mid_tier_substitute is evaluated after every
# rule as the last one. A forced model, hard-pinned utility, classifier and
# compaction turns are never substituted. When the local model cannot carry
# the turn, or fails before any output, the turn is served on the matched model
# (gpt-6-luna above). Session pins, HMM history and policy outcomes keep the
# router's own pick (gpt-5.4-mini), so a repeat turn is not a model switch.
substitution_rules:
  - match: gpt-*-luna
    model: qwen3.8-flash-next
  - match: gpt-*-terra
    model: qwen3.8-flash-next
